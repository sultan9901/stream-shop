# ==========================================================================
# STREAM CORPORATION — test configuration.
#
# ``asyncio_mode = auto`` means every ``async def test_*`` runs without a
# decorator. Both loop-scope options are set to *session* on purpose:
# ``app.database.engine`` is a module-level singleton, so it is bound to the
# first event loop that touches it. A per-test loop would make the second test
# fail with "attached to a different loop".
# ==========================================================================
[pytest]
testpaths = tests
pythonpath = backend
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -q --strict-markers --tb=short
filterwarnings =
    ignore::DeprecationWarning:passlib.*
